name: tests

on:
  push:
  pull_request:

jobs:
  js:
    name: JS suite (logic, exporters, page)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run JS test suite
        run: bash tools/test.sh
      - name: Check generated page.js is up to date
        run: |
          node tools/build_page.js
          git diff --exit-code src/pkjs/page.js \
            || (echo "src/pkjs/page.js is stale — run 'node tools/build_page.js' and commit the result" && exit 1)

  # TODO: add a native build + emulator UI check once the Pebble SDK is
  # wired into CI (it pulls from sdk.repebble.com, so it needs the toolchain
  # cached or vendored):
  #   pebble build && pebble install --emulator emery
